<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Hunter Cyber Mission - Sweet Edition</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800&family=Kanit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
      margin: 0;
      padding: 0;
      font-family: 'Kanit', sans-serif;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #bae6fd;
      color: #0f172a;
    }
    .game-font { font-family: 'Fredoka', 'Kanit', sans-serif; }

    /* Bento Grid Glassmorphism */
    .bento-card {
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 3px solid #ffffff;
      border-radius: 32px;
      box-shadow: 0 20px 45px rgba(255, 77, 109, 0.22), inset 0 2px 0 rgba(255, 255, 255, 0.9);
    }
    .bento-box {
      background: rgba(255, 245, 247, 0.9);
      border: 2px solid #ffccd5;
      border-radius: 20px;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .bento-box:focus-within {
      background: #ffffff;
      border-color: #ff4d6d;
      transform: scale(1.02);
      box-shadow: 0 0 0 4px rgba(255, 77, 109, 0.2);
    }

    /* ปุ่มกดสไตล์นูนเด้ง Tactile */
    .btn-sweet-pink {
      background: linear-gradient(180deg, #ff758f 0%, #ff4d6d 100%);
      box-shadow: 0 6px 0 #c9184a, 0 10px 20px rgba(255, 77, 109, 0.35);
      color: white;
      transition: all 0.1s ease;
    }
    .btn-sweet-pink:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #c9184a;
    }

    .btn-sweet-green {
      background: linear-gradient(180deg, #34d399 0%, #10b981 100%);
      box-shadow: 0 6px 0 #047857, 0 10px 20px rgba(16, 185, 129, 0.35);
      color: white;
      transition: all 0.1s ease;
    }
    .btn-sweet-green:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #047857;
    }

    .btn-sweet-sky {
      background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%);
      box-shadow: 0 6px 0 #0369a1, 0 10px 20px rgba(2, 132, 199, 0.35);
      color: white;
      transition: all 0.1s ease;
    }
    .btn-sweet-sky:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #0369a1;
    }

    .stat-badge {
      background: rgba(255, 255, 255, 0.95);
      border: 2px solid #ffffff;
      box-shadow: 0 4px 12px rgba(255, 77, 109, 0.15);
      border-radius: 20px;
      padding: 6px 14px;
      font-weight: 800;
    }

    /* แอนิเมชันลูกเล่นดิ้นได้ */
    @keyframes jellyBounce {
      0%, 100% { transform: scale(1, 1); }
      30% { transform: scale(1.15, 0.85); }
      50% { transform: scale(0.9, 1.1); }
      70% { transform: scale(1.05, 0.95); }
    }
    .jelly-anim { animation: jellyBounce 2.5s infinite; }

    @keyframes softFloat {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(2deg); }
    }
    .float-anim { animation: softFloat 3s ease-in-out infinite; }

    @keyframes pulseGlow {
      0%, 100% { filter: drop-shadow(0 0 10px rgba(255, 117, 143, 0.4)); }
      50% { filter: drop-shadow(0 0 22px rgba(255, 77, 109, 0.8)); }
    }
    .pulse-glow { animation: pulseGlow 2s infinite; }
  </style>
</head>
<body class="w-screen h-screen flex justify-center items-center relative overflow-hidden bg-gradient-to-b from-[#bae6fd] via-[#e0f2fe] to-[#ffe4e6]">

  <!-- แสงออร่าฟุ้งด้านหลัง -->
  <div class="absolute -top-24 -left-24 w-80 h-80 bg-pink-300/40 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute -bottom-24 -right-24 w-80 h-80 bg-sky-300/40 rounded-full blur-3xl pointer-events-none"></div>

  <!-- 1. เมนูหลักเลือกบทบาท (Home Menu) -->
  <div id="view-mode" class="bento-card p-8 w-full max-w-sm text-center z-50 m-4">
    <div class="inline-block p-4 bg-gradient-to-tr from-pink-400 to-rose-300 rounded-3xl mb-3 shadow-lg shadow-pink-400/30 text-4xl float-anim border-3 border-white">
      🧁✨
    </div>
    <h1 class="game-font text-3xl font-black text-rose-600 mb-1 pulse-glow">WORD JUMP!</h1>
    <p class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-6">Sweet Cyber Playground</p>

    <div class="space-y-3">
      <button onclick="goToHostSetup()" class="btn-sweet-pink w-full py-3.5 rounded-2xl font-black text-base tracking-wide flex items-center justify-center gap-2">
        <span class="text-lg">👑</span> คุณครู / โฮสต์ (สร้างห้อง)
      </button>
      <button onclick="goToJoinScreen()" class="btn-sweet-sky w-full py-3.5 rounded-2xl font-black text-base tracking-wide flex items-center justify-center gap-2">
        <span class="text-lg">🎮</span> นักเรียน (เข้าเล่นเกม)
      </button>
    </div>
  </div>

  <!-- 2. หน้า Host ตั้งค่าห้อง & QR Code -->
  <div id="view-host" class="bento-card p-6 w-full max-w-md text-center z-50 m-4 hidden">
    <h2 class="text-xl font-black text-rose-600 mb-1">ห้องควบคุมการแข่งขัน</h2>
    <p class="text-xs font-bold text-slate-400 mb-2">รหัสห้องสำหรับผู้เรียน (PIN Code):</p>
    <div id="host-pin-display" class="game-font text-3xl tracking-widest font-black text-rose-600 bg-pink-100/80 border-2 border-dashed border-pink-400 py-2 rounded-2xl mb-3">------</div>

    <div class="flex flex-col items-center bg-white p-3 rounded-2xl border border-pink-200 shadow-sm w-fit mx-auto mb-3">
      <div id="qrcode-box"></div>
      <span class="text-[11px] font-bold text-rose-500 mt-1">สแกน QR เพื่อเข้าเล่นทันที</span>
    </div>

    <div class="grid grid-cols-2 gap-2 text-left mb-3">
      <div class="bento-box p-2.5">
        <label class="text-[11px] font-bold text-slate-400 block mb-1">เวลาแข่งขัน</label>
        <select id="select-duration" class="w-full bg-transparent font-bold text-xs text-rose-600 outline-none">
          <option value="60">1 นาที (ทดสอบ)</option>
          <option value="180" selected>3 นาที</option>
          <option value="300">5 นาที</option>
          <option value="600">10 นาที</option>
        </select>
      </div>
      <div class="bento-box p-2.5">
        <label class="text-[11px] font-bold text-slate-400 block mb-1">พลังงานเริ่มต้น</label>
        <input id="input-host-energy" type="number" min="1" max="50" value="5" class="w-full bg-transparent font-black text-xs text-amber-500 outline-none text-center">
      </div>
    </div>

    <p class="text-xs font-bold text-slate-500 mb-2">ผู้เรียนในห้อง: <span id="player-count" class="text-emerald-500 font-black">0</span> คน</p>
    <div id="host-player-badges" class="flex flex-wrap gap-1.5 justify-center max-h-20 overflow-y-auto mb-3"></div>

    <div class="flex gap-2">
      <button onclick="location.reload()" class="w-1/3 py-3 bg-slate-100 border border-slate-200 text-slate-600 rounded-2xl font-bold text-xs">ย้อนกลับ</button>
      <button id="btn-host-start" onclick="hostStartMatch()" class="btn-sweet-green w-2/3 py-3 rounded-2xl font-black text-sm">🚀 เริ่มการแข่งขัน</button>
    </div>
  </div>

  <!-- 3. หน้า Join เข้าห้องของผู้เรียน -->
  <div id="view-join" class="bento-card p-7 w-full max-w-sm text-center z-50 m-4 hidden">
    <h2 class="text-xl font-black text-sky-600 mb-4">เข้าสู่ห้องแข่งขัน</h2>
    <div class="space-y-3 text-left">
      <div class="bento-box p-3">
        <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider block mb-1">รหัสห้อง 6 หลัก</label>
        <input id="input-join-pin" type="text" placeholder="เช่น 123456" maxlength="6" inputmode="numeric" class="w-full bg-transparent font-black tracking-widest text-sky-600 text-center text-lg outline-none">
      </div>
      <div class="bento-box p-3">
        <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider block mb-1">ชื่อเล่นของคุณ</label>
        <input id="input-join-name" type="text" placeholder="ระบุชื่อ..." value="นักเรียน" maxlength="12" class="w-full bg-transparent font-bold text-slate-700 text-center text-base outline-none">
      </div>
      <button onclick="joinGameRoom()" class="btn-sweet-sky w-full py-3.5 rounded-2xl font-black text-base mt-2">เข้าห้อง 🚀</button>
      <button onclick="location.reload()" class="w-full py-2.5 bg-slate-100 text-slate-500 rounded-xl font-bold text-xs">ย้อนกลับ</button>
    </div>
  </div>

  <!-- 4. หน้าต่างรอเริ่มแข่งขัน (Waiting Lounge) -->
  <div id="view-waiting" class="bento-card p-8 w-full max-w-sm text-center z-50 m-4 hidden">
    <div class="text-4xl float-anim mb-3">⏳</div>
    <h2 class="text-xl font-black text-rose-600 mb-1">เตรียมพร้อมแล้ว!</h2>
    <p class="text-xs font-bold text-slate-400">ห้อง PIN: <span id="wait-pin-label" class="text-rose-600 font-black">------</span></p>
    <p class="text-xs font-bold text-slate-400 mb-5">ผู้เล่น: <span id="wait-name-label" class="text-emerald-500 font-black">นักเรียน</span></p>

    <div class="p-3 bg-amber-50 border border-amber-200 rounded-2xl text-xs font-bold text-amber-700 mb-4">
      รอคุณครูกดปล่อยตัว... หรือกดเริ่มซ้อมกระโดดได้ทันที!
    </div>

    <button onclick="forceStartSinglePlay()" class="btn-sweet-green w-full py-3.5 rounded-2xl font-black text-sm">
      ▶ เริ่มกระโดดซ้อมทันที
    </button>
  </div>

  <!-- 5. หน้าต่าง Host Live Monitor สดๆ -->
  <div id="view-host-live" class="hidden w-full h-full bg-slate-900 text-white flex flex-col p-4 sm:p-6 overflow-hidden z-40">
    <div class="bento-card !bg-slate-800/95 !border-slate-700 p-4 rounded-3xl flex flex-wrap justify-betw
