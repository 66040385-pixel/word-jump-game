<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Hunter Cyber Mission - Perfect Edition</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100dvh;
      min-height: -webkit-fill-available;
      overflow: hidden;
      background: radial-gradient(circle at center, #1e1b4b 0%, #0f172a 100%);
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      position: fixed;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .container {
      background: rgba(255, 255, 255, 0.95);
      border: 2px solid rgba(255, 117, 143, 0.4);
      border-radius: 32px;
      padding: 26px;
      max-width: 480px;
      width: 90%;
      text-align: center;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(255, 117, 143, 0.2);
      backdrop-filter: blur(20px);
      max-height: 90dvh;
      overflow-y: auto;
      z-index: 100;
      position: relative;
      color: #0f172a;
    }
    h1 {
      color: #e01e37;
      margin: 0 0 6px 0;
      font-size: 26px;
      letter-spacing: 0.5px;
      font-weight: 900;
    }
    h2 {
      color: #e01e37;
      font-weight: 800;
      margin-top: 0;
    }
    .btn {
      background: linear-gradient(135deg, #ff758f 0%, #ff4d6d 100%);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 18px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      width: 100%;
      margin: 8px 0;
      box-shadow: 0 8px 20px rgba(255, 77, 109, 0.35);
      display: block;
      transition: all 0.15s ease;
    }
    .btn:active { transform: scale(0.97); }
    .btn-sweet-green {
      background: linear-gradient(135deg, #34d399 0%, #059669 100%);
      color: white;
      border: none;
      padding: 13px;
      border-radius: 18px;
      font-weight: 800;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 8px 20px rgba(16, 185, 129, 0.35);
      transition: all 0.15s ease;
    }
    .btn-sweet-green:active { transform: scale(0.97); }

    input, select {
      width: 100%;
      padding: 13px 16px;
      margin: 6px 0 12px 0;
      border-radius: 16px;
      border: 2px solid #ffccd5;
      background: #fff5f7;
      color: #e01e37;
      text-align: center;
      font-size: 16px;
      font-weight: bold;
      outline: none;
      user-select: auto;
      -webkit-user-select: auto;
      transition: all 0.2s;
    }
    input:focus, select:focus {
      border-color: #ff4d6d;
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(255, 77, 109, 0.15);
    }
    .pin-display {
      font-size: 42px;
      letter-spacing: 8px;
      font-weight: 900;
      color: #e01e37;
      background: #ffe4e6;
      padding: 8px;
      border-radius: 18px;
      margin: 10px 0;
      border: 2.5px dashed #ff758f;
    }
    .qr-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #fff;
      padding: 14px;
      border-radius: 20px;
      width: fit-content;
      margin: 10px auto;
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
      border: 1px solid #ffe4e6;
    }
    .badge-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      margin: 10px 0;
      max-height: 110px;
      overflow-y: auto;
    }
    .badge {
      background: #ffe4e6;
      border: 1px solid #ff758f;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      color: #e01e37;
      font-weight: bold;
    }
    .hidden { display: none !important; }

    #view-host-live {
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100dvh;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      z-index: 40;
      display: flex;
      flex-direction: column;
      padding: 20px;
      overflow: hidden;
    }
    .host-header-card {
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(16px);
      border-radius: 24px;
      padding: 18px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.3);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .host-leader-bar {
      margin-top: 14px;
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.2) 0%, rgba(234, 179, 8, 0.05) 100%);
      border: 1px solid rgba(245, 158, 11, 0.4);
      padding: 14px 20px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      color: #fef08a;
      font-weight: bold;
    }
    .host-table-wrapper {
      margin-top: 14px;
      flex: 1;
      overflow-y: auto;
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 16px;
      box-shadow: inset 0 4px 15px rgba(0,0,0,0.4);
    }

    #game-wrapper {
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100dvh;
      background: #e0f2fe;
      overflow: hidden;
      z-index: 50;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* ปรับปรุง Top Bar ไม่ให้ชิดขวาและเว้นระยะพอดี */
    .game-top-bar {
      position: absolute;
      top: env(safe-area-inset-top, 14px);
      left: 18px;
      right: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      z-index: 70;
      pointer-events: none;
    }
    .game-top-bar-left, .game-top-bar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .stat-pill {
      background: rgba(255, 255, 255, 0.95);
      border: 1.5px solid rgba(255, 117, 143, 0.4);
      backdrop-filter: blur(8px);
      padding: 7px 14px;
      border-radius: 20px;
      font-weight: 800;
      font-size: 13px;
      color: #0f172a;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
      white-space: nowrap;
    }
    .btn-top-quiz {
      background: linear-gradient(135deg, #ff758f, #ff4d6d);
      border: 1.5px solid #ffffff;
      color: white;
      padding: 7px 16px;
      border-radius: 20px;
      font-weight: 900;
      font-size: 13px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(255, 77, 109, 0.4);
      pointer-events: auto;
      white-space: nowrap;
    }
    .btn-music-toggle {
      background: rgba(255, 255, 255, 0.95);
      border: 1.5px solid #bae6fd;
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 14px;
      cursor: pointer;
      pointer-events: auto;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }

    .controls-bar {
      position: absolute;
      bottom: max(env(safe-area-inset-bottom), 18px);
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      z-index: 80;
      pointer-events: none;
    }
    .touch-dpad-container {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 2.5px solid rgba(255, 255, 255, 0.95);
      border-radius: 36px;
      padding: 8px;
      box-shadow: 0 12px 30px rgba(2, 132, 199, 0.2);
      display: flex;
      gap: 10px;
      pointer-events: auto;
    }
    .touch-btn-arrow {
      width: 66px;
      height: 66px;
      border-radius: 26px;
      background: linear-gradient(180deg, #ffffff 0%, #f0f9ff 100%);
      border: 2px solid #bae6fd;
      color: #0284c7;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: 900;
      box-shadow: 0 5px 0 #7dd3fc, 0 8px 16px rgba(2, 132, 199, 0.15);
      transition: all 0.08s ease;
      cursor: pointer;
      touch-action: none;
    }
    .touch-btn-arrow.active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #7dd3fc;
      background: #e0f2fe;
      color: #0369a1;
    }
    .action-pad { pointer-events: auto; }
    .touch-btn-jump {
      width: 82px;
      height: 82px;
      border-radius: 50%;
      background: linear-gradient(180deg, #34d399 0%, #10b981 100%);
      border: 4px solid #ffffff;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 0 #047857, 0 14px 28px rgba(16, 185, 129, 0.4);
      transition: all 0.08s ease;
      cursor: pointer;
      touch-action: none;
      font-size: 34px;
    }
    .touch-btn-jump.active {
      transform: translateY(5px);
      box-shadow: 0 3px 0 #047857;
      background: #059669;
    }

    #toast-msg {
      position: absolute;
      top: 65px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.92);
      color: white;
      padding: 10px 22px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
      z-index: 250;
      opacity: 0;
      transition: opacity 0.25s, transform 0.25s;
      pointer-events: none;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }
    #toast-msg.show {
      opacity: 1;
      transform: translateX(-50%) translateY(10px);
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100dvh;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(8px);
      z-index: 150;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .quiz-card {
      background: #ffffff;
      border-radius: 28px;
      padding: 24px;
      width: 90%;
      max-width: 440px;
      color: #0f172a;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      text-align: center;
    }
    .quiz-options {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-top: 16px;
    }
    .quiz-opt-btn {
      background: #f1f5f9;
      border: 2px solid #e2e8f0;
      border-radius: 16px;
      padding: 12px 16px;
      font-size: 15px;
      font-weight: 700;
      color: #1e293b;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s;
    }
    .quiz-opt-btn:active {
      border-color: #ff4d6d;
      background: #ffe4e6;
      color: #e01e37;
    }
  </style>
</head>
<body>

  <div id="toast-msg">แจ้งเตือน</div>

  <!-- หน้าแรก (Lobby) -->
  <div id="view-lobby" class="container">
    <h1>CYBER MISSION</h1>
    <p style="color: #64748b; font-size: 13px; margin: 0 0 16px 0;">ระบบภารกิจกระโดดวัดความรู้ไซเบอร์</p>
    
    <input type="text" id="input-player-name" placeholder="ใส่ชื่อผู้เล่นของคุณ" maxlength="15">
    <input type="text" id="input-join-pin" placeholder="รหัส PIN 4 หลัก" maxlength="4" inputmode="numeric">
    <button class="btn" onclick="joinGame()">เข้าร่วมห้องเรียน</button>
    
    <div style="margin: 18px 0 10px 0; display: flex; align-items: center; gap: 10px;">
      <hr style="flex:1; border: none; border-top: 1px solid #cbd5e1;">
      <span style="color: #94a3b8; font-size: 12px; font-weight: bold;">สำหรับครูผู้สอน</span>
      <hr style="flex:1; border: none; border-top: 1px solid #cbd5e1;">
    </div>
    <button class="btn-sweet-green" onclick="hostCreateRoom()">สร้างห้องเรียนใหม่ (ครู)</button>
  </div>

  <!-- หน้ารอเริ่มห้องสำหรับครู (Host Lobby) -->
  <div id="view-host-wait" class="container hidden">
    <h2>ห้องเรียนไซเบอร์</h2>
    <div style="font-size: 14px; color: #64748b;">ให้นักเรียนเข้าร่วมด้วย PIN:</div>
    <div class="pin-display" id="display-room-pin">0000</div>
    
    <div class="qr-container">
      <div id="qrcode"></div>
    </div>
    
    <div style="font-size: 13px; color: #475569; margin-top: 6px;">ผู้เล่นที่พร้อมแล้ว:</div>
    <div class="badge-list" id="host-wait-player-list"></div>

    <button class="btn-sweet-green" onclick="hostStartMatch()" style="margin-top: 14px;">เปิดภารกิจและเข้าสู่หน้าจอคุมห้อง</button>
    <button class="btn" onclick="returnToLobby()" style="background: #94a3b8; box-shadow: none;">ยกเลิกห้อง</button>
  </div>

  <!-- หน้าคุมการสอนสดของครู (Host Live Dashboard) -->
  <div id="view-host-live" class="hidden">
    <div class="host-header-card">
      <div>
        <h2 style="margin: 0; color: #f43f5e; font-size: 20px;">ห้อง: <span id="live-room-pin" style="color:white;">0000</span></h2>
        <span style="font-size: 13px; color: #94a3b8;">ครูผู้สอนกำลังคุมการทำภารกิจ</span>
      </div>
      <div style="display: flex; gap: 10px;">
        <button class="btn-sweet-green" onclick="hostRestartMatch()" style="width: auto; padding: 10px 18px; margin: 0; font-size: 13px;">เริ่มเกมใหม่ (Host เดิม)</button>
        <button class="btn" onclick="returnToLobby()" style="width: auto; padding: 10px 18px; margin: 0; background: #ef4444; font-size: 13px; box-shadow: none;">ปิดห้อง</button>
      </div>
    </div>

    <div class="host-leader-bar">
      <div>🏆 ผู้นำปัจจุบัน: <span id="top-leader-name" style="color: #ffffff;">ยังไม่มี</span></div>
      <div>ระดับความสูง: <span id="top-leader-height" style="color: #ffffff;">0</span> m</div>
    </div>

    <div class="host-table-wrapper" id="host-players-table">
      <!-- ตารางรายชื่อและปุ่มลบจะแสดงที่นี่ -->
    </div>
  </div>

  <!-- หน้าจอเกมสำหรับผู้เล่น (Canvas View) -->
  <div id="game-wrapper" class="hidden">
    <canvas id="gameCanvas"></canvas>

    <div class="game-top-bar">
      <div class="game-top-bar-left">
        <button class="btn-music-toggle" onclick="toggleBGM()">🎵</button>
        <div class="stat-pill" id="hud-name">👤 Player</div>
      </div>
      <div class="game-top-bar-right">
        <button class="btn-top-quiz" onclick="openQuizModal()">ตอบคำถาม ⚡</button>
        <div class="stat-pill" id="hud-height">ความสูง: 0 m</div>
      </div>
    </div>

    <div class="controls-bar">
      <div class="touch-dpad-container">
        <div class="touch-btn-arrow" id="btn-left">◀</div>
        <div class="touch-btn-arrow" id="btn-right">▶</div>
      </div>
      <div class="action-pad">
        <div class="touch-btn-jump" id="btn-jump">▲</div>
      </div>
    </div>
  </div>

  <!-- Modal คำถามไซเบอร์ -->
  <div id="modal-quiz" class="modal-overlay hidden">
    <div class="quiz-card">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <span style="font-weight: 800; color: #e01e37;" id="quiz-badge">ภารกิจที่ 1</span>
        <span style="font-size: 12px; color: #64748b;" id="quiz-counter">1/5</span>
      </div>
      <h3 id="quiz-question" style="margin: 14px 0; font-size: 17px; line-height: 1.4;">คำถามทดสอบ</h3>
      <div class="quiz-options" id="quiz-options-box"></div>
    </div>
  </div>

  <script>
    /* ========================================================
       คลังข้อสอบไซเบอร์ (รันเรียงลำดับ 1 -> ครบ -> วนใหม่)
       ======================================================== */
    const CYBER_QUESTIONS = [
      {
        q: "เมื่อได้รับ SMS แจ้งว่า 'พัสดุของคุณถูกระงับ ให้คลิกลิงก์เพื่อยืนยัน' ควรทำอย่างไร?",
        options: ["คลิกเพื่อตรวจสอบทันที", "ลบข้อความและโทรสอบถามบริษัทขนส่งโดยตรง", "ส่งต่อให้เพื่อนช่วยดู", "กรอกข้อมูลบัตรประชาชนทันที"],
        ans: 1
      },
      {
        q: "การตั้งรหัสผ่านที่ปลอดภัยที่สุด ควรมีลักษณะอย่างไร?",
        options: ["ใช้วันเดือนปีเกิดของตนเอง", "ใช้เบอร์โทรศัพท์มือถือ", "ยาวเกิน 8 ตัว มีทั้งพิมพ์ใหญ่ เล็ก ตัวเลข และสัญลักษณ์", "ใช้คำว่า 12345678"],
        ans: 2
      },
      {
        q: "2FA (Two-Factor Authentication) มีประโยชน์อย่างไร?",
        options: ["เพิ่มการยืนยันตัวตนอีกขั้นเพื่อความปลอดภัย", "ช่วยให้เน็ตเร็วขึ้น", "ทำให้ไม่ต้องจำรหัสผ่าน", "ช่วยกู้คืนไฟล์ที่ถูกลบ"],
        ans: 0
      },
      {
        q: "Phishing (ฟิชชิ่ง) คือภัยคุกคามลักษณะใด?",
        options: ["ไวรัสคอมพิวเตอร์ชนิดกินแรม", "การหลอกลวงเพื่อขโมยรหัสผ่านหรือข้อมูลส่วนตัวผ่านลิงก์ปลอม", "การทำให้อินเทอร์เน็ตหลุด", "โปรแกรมสแกนเครื่อง"],
        ans: 1
      },
      {
        q: "เมื่อใช้งานคอมพิวเตอร์สาธารณะ ข้อใดสำคัญที่สุด?",
        options: ["กดจำรหัสผ่านไว้เพื่อความสะดวก", "เปิดเพลงเสียงดัง", "ออกจากระบบ (Log out) ทุกครั้งหลังใช้งาน", "ลบประวัติการท่องเว็บอย่างเดียวก็พอ"],
        ans: 2
      }
    ];

    /* ========================================================
       ระบบ STATE & BroadcastChannel (เชื่อมต่อระหว่างแท็บ)
       ======================================================== */
    let role = null; // 'host' หรือ 'player'
    let currentPin = '';
    let myId = 'p_' + Math.random().toString(36).substr(2, 7);
    let myName = '';
    let currentQuestionIndex = 0; // ลำดับข้อสอบปัจจุบัน (รันตามข้อ)

    let roomState = {
      pin: '',
      status: 'waiting', // 'waiting', 'playing'
      players: {}
    };

    const networkChannel = new BroadcastChannel('hunter_cyber_channel');

    networkChannel.onmessage = (event) => {
      const { type, payload, pin, targetId } = event.data;
      if (pin !== currentPin) return;

      // ถ้าเป็นนักเรียน แล้วถูก Host สั่งลบ
      if (type === 'KICK_PLAYER' && role === 'player' && targetId === myId) {
        alert("คุณถูกครูผู้สอนนำออกจากห้องเรียน");
        window.location.reload();
        return;
      }

      // ฝั่ง Host รับการเข้าร่วม
      if (type === 'PLAYER_JOIN' && role === 'host') {
        if (!roomState.players[payload.id]) {
          roomState.players[payload.id] = {
            id: payload.id,
            name: payload.name,
            height: 0,
            y: 0
          };
          syncRoomState();
          updateHostUI();
        }
      }

      // ฝั่ง Host รับค่าความสูงแบบ Realtime
      if (type === 'UPDATE_HEIGHT' && role === 'host') {
        if (roomState.players[payload.id]) {
          roomState.players[payload.id].height = payload.height;
          updateHostUI();
        }
      }

      // ฝั่ง Player รับการซิงค์สถานะห้อง
      if (type === 'SYNC_STATE' && role === 'player') {
        // ตรวจสอบว่าตนเองยังมีชื่ออยู่ในห้องไหม (หากครูกดลบ)
        if (roomState.status === 'playing' && payload.players && !payload.players[myId]) {
          alert("คุณถูกครูผู้สอนนำออกจากห้องเรียน");
          window.location.reload();
          return;
        }

        roomState = payload;
        if (roomState.status === 'playing' && document.getElementById('game-wrapper').classList.contains('hidden')) {
          startGameView();
        } else if (roomState.status === 'reset' && role === 'player') {
          // ครูสั่งเริ่มใหม่
          resetPlayerPosition();
          showToast("ครูสั่งเริ่มเกมใหม่แล้ว!");
        }
      }
    };

    function syncRoomState() {
      networkChannel.postMessage({
        type: 'SYNC_STATE',
        pin: currentPin,
        payload: roomState
      });
    }

    function showToast(text) {
      const toast = document.getElementById('toast-msg');
      toast.innerText = text;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2200);
    }

    /* ========================================================
       HOST FUNCTIONS (ฝั่งครูผู้สอน)
       ======================================================== */
    function hostCreateRoom() {
      role = 'host';
      currentPin = Math.floor(1000 + Math.random() * 9000).toString();
      roomState = {
        pin: currentPin,
        status: 'waiting',
        players: {}
      };

      document.getElementById('view-lobby').classList.add('hidden');
      document.getElementById('view-host-wait').classList.remove('hidden');
      document.getElementById('display-room-pin').innerText = currentPin;

      // สร้าง QR Code จำลอง
      const qrEl = document.getElementById('qrcode');
      qrEl.innerHTML = '';
      new QRCode(qrEl, {
        text: window.location.origin + window.location.pathname + '?pin=' + currentPin,
        width: 120,
        height: 120
      });

      updateHostUI();
    }

    // ครูสั่งลบ/เตะผู้เล่น
    function kickPlayer(pId) {
      if (!confirm("ต้องการลบผู้เล่นคนนี้ออกจากห้องใช่หรือไม่?")) return;
      
      delete roomState.players[pId];
      
      // ส่งคำสั่งแจ้งให้แท็บนักเรียนคนนั้นรู้
      networkChannel.postMessage({
        type: 'KICK_PLAYER',
        pin: currentPin,
        targetId: pId
      });

      syncRoomState();
      updateHostUI();
    }

    // ครูสั่งเริ่มเกมรอบแรก
    function hostStartMatch() {
      role = 'host'; // ยืนยันสถานะ host
      roomState.status = 'playing';
      syncRoomState();

      document.getElementById('view-host-wait').classList.add('hidden');
      document.getElementById('view-host-live').classList.remove('hidden');
      document.getElementById('live-room-pin').innerText = currentPin;
      updateHostUI();
    }

    // ครูสั่งเริ่มใหม่ (คงสถานะ Host ไว้ ไม่หลุดไปเป็น Player)
    function hostRestartMatch() {
      if (!confirm("ต้องการรีเซ็ตเริ่มรอบใหม่ให้กับทุกคนใช่หรือไม่?")) return;
      role = 'host'; // ล็อกให้เป็น Host เสมอ
      
      // รีเซ็ตความสูงของผู้เล่นทุกคนในห้อง
      Object.keys(roomState.players).forEach(id => {
        roomState.players[id].height = 0;
      });

      networkChannel.postMessage({
        type: 'SYNC_STATE',
        pin: currentPin,
        payload: { ...roomState, status: 'reset' }
      });
      
      roomState.status = 'playing';
      syncRoomState();
      updateHostUI();
      showToast("รีเซ็ตเกมใหม่แล้ว ครูยังเป็น Host คุมห้องอยู่");
    }

    function updateHostUI() {
      // หน้าต่างรอ
      const waitList = document.getElementById('host-wait-player-list');
      if (waitList) {
        waitList.innerHTML = Object.values(roomState.players).map(p => 
          `<div class="badge">${p.name}</div>`
        ).join('') || '<span style="color:#94a3b8; font-size:12px;">กำลังรอนักเรียนเข้าร่วม...</span>';
      }

      // หน้าระหว่างเล่นสด (Live Dashboard)
      const tableWrapper = document.getElementById('host-players-table');
      if (tableWrapper && role === 'host') {
        const sorted = Object.values(roomState.players).sort((a, b) => (b.height || 0) - (a.height || 0));

        if (sorted.length > 0) {
          document.getElementById('top-leader-name').innerText = sorted[0].name;
          document.getElementById('top-leader-height').innerText = Math.floor(sorted[0].height || 0);
        } else {
          document.getElementById('top-leader-name').innerText = "ยังไม่มี";
          document.getElementById('top-leader-height').innerText = "0";
        }

        let html = `
          <table style="width: 100%; border-collapse: collapse; color: white; font-size: 14px;">
            <thead>
              <tr style="border-bottom: 1px solid rgba(255,255,255,0.2); color: #94a3b8; text-align: left;">
                <th style="padding: 10px;">อันดับ</th>
                <th style="padding: 10px;">ชื่อผู้เล่น</th>
                <th style="padding: 10px; text-align: center;">ความสูง (ม.)</th>
                <th style="padding: 10px; text-align: right;">จัดการ</th>
              </tr>
            </thead>
            <tbody>
        `;

        sorted.forEach((p, idx) => {
          html += `
            <tr style="border-bottom: 1px solid rgba(255,255,255,0.08);">
              <td style="padding: 10px;">#${idx + 1}</td>
              <td style="padding: 10px; font-weight: bold;">${p.name}</td>
              <td style="padding: 10px; text-align: center; color: #38bdf8; font-weight: bold;">${Math.floor(p.height || 0)} m</td>
              <td style="padding: 10px; text-align: right;">
                <button onclick="kickPlayer('${p.id}')" 
                        style="background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 12px;">
                  ลบออก
                </button>
              </td>
            </tr>
          `;
        });

        html += `</tbody></table>`;
        tableWrapper.innerHTML = html;
      }
    }

    function returnToLobby() {
      window.location.reload();
    }

    /* ========================================================
       PLAYER FUNCTIONS (ฝั่งนักเรียน)
       ======================================================== */
    function joinGame() {
      const name = document.getElementById('input-player-name').value.trim();
      const pin = document.getElementById('input-join-pin').value.trim();

      if (!name) { alert("กรุณากรอกชื่อของคุณ"); return; }
      if (pin.length !== 4) { alert("กรุณากรอกรหัส PIN 4 หลัก"); return; }

      role = 'player';
      currentPin = pin;
      myName = name;

      networkChannel.postMessage({
        type: 'PLAYER_JOIN',
        pin: currentPin,
        payload: { id: myId, name: myName }
      });

      document.getElementById('view-lobby').innerHTML = `
        <h2>รอครูผู้สอนเริ่มเกม...</h2>
        <div class="pin-display">${currentPin}</div>
        <p style="color: #64748b;">ชื่อของคุณ: <b>${myName}</b></p>
        <p style="font-size: 13px; color: #94a3b8;">ระบบจะเข้าสู่ด่านอัตโนมัติเมื่อครูเริ่มเปิดภารกิจ</p>
      `;
    }

    function startGameView() {
      document.getElementById('view-lobby').classList.add('hidden');
      document.getElementById('game-wrapper').classList.remove('hidden');
      document.getElementById('hud-name').innerText = `👤 ${myName}`;
      initGameEngine();
    }

    /* ========================================================
       ระบบข้อสอบแบบรันตามลำดับ (Sequential Loop)
       ======================================================== */
    function openQuizModal() {
      const modal = document.getElementById('modal-quiz');
      const q = CYBER_QUESTIONS[currentQuestionIndex];

      document.getElementById('quiz-badge').innerText = `ข้อที่ ${currentQuestionIndex + 1}`;
      document.getElementById('quiz-counter').innerText = `${currentQuestionIndex + 1}/${CYBER_QUESTIONS.length}`;
      document.getElementById('quiz-question').innerText = q.q;

      const optsBox = document.getElementById('quiz-options-box');
      optsBox.innerHTML = '';
      q.options.forEach((optText, index) => {
        const btn = document.createElement('button');
        btn.className = 'quiz-opt-btn';
        btn.innerText = `${index + 1}. ${optText}`;
        btn.onclick = () => answerQuestion(index);
        optsBox.appendChild(btn);
      });

      modal.classList.remove('hidden');
    }

    function answerQuestion(choiceIndex) {
      const q = CYBER_QUESTIONS[currentQuestionIndex];
      const modal = document.getElementById('modal-quiz');
      modal.classList.add('hidden');

      if (choiceIndex === q.ans) {
        showToast("ตอบถูก! พลังกระโดดพุ่งทะยาน 🚀");
        player.vy = -18; // ได้รับแรงกระโดดซูเปอร์
      } else {
        showToast("ตอบไม่ถูกต้อง ระวังสะดุด!");
      }

      // ขยับไปข้อถัดไป ถ้าถึงข้อสุดท้ายให้วนกลับมาข้อ 0
      currentQuestionIndex = (currentQuestionIndex + 1) % CYBER_QUESTIONS.length;
    }

    /* ========================================================
       ENGINE ตัวเกมกระโดด (Canvas 2D + Realtime Height)
       ======================================================== */
    let canvas, ctx;
    let platforms = [];
    let startBaseY = 0;
    let cameraY = 0;

    let player = {
      x: 0,
      y: 0,
      w: 32,
      h: 44,
      vx: 0,
      vy: 0,
      isGrounded: false
    };

    let keys = { left: false, right: false };

    function resetPlayerPosition() {
      player.x = canvas.width / 2 - 16;
      player.y = canvas.height - 140;
      player.vx = 0;
      player.vy = 0;
      cameraY = 0;
      startBaseY = canvas.height - 100;
    }

    function initGameEngine() {
      canvas = document.getElementById('gameCanvas');
      ctx = canvas.getContext('2d');

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      startBaseY = canvas.height - 100;
      resetPlayerPosition();

      // สร้างแพลตฟอร์มบันไดความรู้
      platforms = [
        { x: canvas.width / 2 - 80, y: canvas.height - 100, w: 160, h: 18, type: 'base' }
      ];

      for (let i = 1; i < 70; i++) {
        platforms.push({
          x: Math.random() * (canvas.width - 110),
          y: (canvas.height - 100) - (i * 90),
          w: 80 + Math.random() * 40,
          h: 16,
          type: 'platform'
        });
      }

      setupControls();
      requestAnimationFrame(gameLoop);
    }

    function setupControls() {
      // คีย์บอร์ด
      window.addEventListener('keydown', (e) => {
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
        if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
        if ((e.code === 'ArrowUp' || e.code === 'Space') && player.isGrounded) {
          player.vy = -13;
          player.isGrounded = false;
        }
      });
      window.addEventListener('keyup', (e) => {
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
        if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
      });

      // ปุ่มสัมผัสบนมือถือ
      const bLeft = document.getElementById('btn-left');
      const bRight = document.getElementById('btn-right');
      const bJump = document.getElementById('btn-jump');

      const bindTouch = (elem, pressCallback, releaseCallback) => {
        const start = (e) => { e.preventDefault(); elem.classList.add('active'); pressCallback(); };
        const end = (e) => { e.preventDefault(); elem.classList.remove('active'); releaseCallback(); };
        elem.addEventListener('touchstart', start, { passive: false });
        elem.addEventListener('touchend', end, { passive: false });
        elem.addEventListener('mousedown', start);
        elem.addEventListener('mouseup', end);
        elem.addEventListener('mouseleave', end);
      };

      bindTouch(bLeft, () => keys.left = true, () => keys.left = false);
      bindTouch(bRight, () => keys.right = true, () => keys.right = false);
      bindTouch(bJump, () => {
        if (player.isGrounded) {
          player.vy = -13;
          player.isGrounded = false;
        }
      }, () => {});
    }

    let lastBroadcastTime = 0;

    function gameLoop(timestamp) {
      // 1. ฟิสิกส์การเคลื่อนที่
      if (keys.left) player.vx = -5;
      else if (keys.right) player.vx = 5;
      else player.vx *= 0.82;

      player.vy += 0.55; // แรงโน้มถ่วง
      player.x += player.vx;
      player.y += player.vy;

      // ชนขอบซ้าย-ขวา
      if (player.x < 0) player.x = 0;
      if (player.x + player.w > canvas.width) player.x = canvas.width - player.w;

      // 2. การชนกับแท่นกระโดด
      player.isGrounded = false;
      platforms.forEach(plat => {
        if (
          player.vy > 0 &&
          player.x + player.w > plat.x &&
          player.x < plat.x + plat.w &&
          player.y + player.h >= plat.y &&
          player.y + player.h <= plat.y + 16
        ) {
          player.y = plat.y - player.h;
          player.vy = 0;
          player.isGrounded = true;
        }
      });

      // ตกต่ำสุดให้กลับมาแท่นแรก
      if (player.y > startBaseY + 300) {
        player.x = canvas.width / 2 - 16;
        player.y = startBaseY - player.h;
        player.vy = 0;
      }

      // 3. ปรับระดับความสูงตามตำแหน่ง Y จริง (ถ้าตกลงมา ความสูงจะลดลงตามจริง)
      const currentRealHeight = Math.max(0, Math.floor((startBaseY - (player.y + player.h)) / 10));
      document.getElementById('hud-height').innerText = `ความสูง: ${currentRealHeight} m`;

      // ส่งตำแหน่งความสูงอัปเดตไปที่ Host (ทุกๆ 150ms)
      if (role === 'player' && timestamp - lastBroadcastTime > 150) {
        lastBroadcastTime = timestamp;
        networkChannel.postMessage({
          type: 'UPDATE_HEIGHT',
          pin: currentPin,
          payload: { id: myId, height: currentRealHeight }
        });
      }

      // 4. มุมกล้องติดตามผู้เล่น
      const targetCamY = player.y - canvas.height * 0.55;
      cameraY += (targetCamY - cameraY) * 0.1;

      // 5. วาดกราฟิก
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.save();
      ctx.translate(0, -cameraY);

      // วาดแพลตฟอร์ม
      platforms.forEach(plat => {
        ctx.fillStyle = plat.type === 'base' ? '#0284c7' : '#38bdf8';
        ctx.beginPath();
        ctx.roundRect(plat.x, plat.y, plat.w, plat.h, 8);
        ctx.fill();

        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.stroke();
      });

      // วาดตัวละครผู้เล่น (Cyber Hunter)
      ctx.fillStyle = '#ff4d6d';
      ctx.beginPath();
      ctx.roundRect(player.x, player.y, player.w, player.h, 10);
      ctx.fill();

      // แว่นไซเบอร์
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(player.x + 6, player.y + 10, player.w - 12, 8);

      ctx.restore();

      requestAnimationFrame(gameLoop);
    }

    /* ========================================================
       ระบบเสียงพื้นหลังสังเคราะห์ (Web Audio API)
       ======================================================== */
    let audioCtx = null;
    let isPlayingAudio = false;
    let audioInterval = null;

    function toggleBGM() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();

      if (isPlayingAudio) {
        clearInterval(audioInterval);
        isPlayingAudio = false;
        showToast("ปิดเสียงเพลง");
      } else {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        isPlayingAudio = true;
        showToast("เปิดเสียงเพลง 🎵");

        // เมโลดี้สไตล์ 8-bit ไซเบอร์
        const notes = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25];
        let step = 0;
        audioInterval = setInterval(() => {
          if (!isPlayingAudio) return;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(notes[step % notes.length], audioCtx.currentTime);
          
          gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.25);

          osc.connect(gain);
          gain.connect(audioCtx.destination);

          osc.start();
          osc.stop(audioCtx.currentTime + 0.25);
          step++;
        }, 300);
      }
    }
  </script>
